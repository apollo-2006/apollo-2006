<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d09a2e" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#d09a2e" stop-opacity="0.75"/>
      <stop offset="70%"  stop-color="#d09a2e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d09a2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="13.4" width="900" height="1.2" fill="url(#fade)"/>
  <g transform="translate(450 14)">
    <circle r="9" fill="#0b1220" stroke="#e8c25e" stroke-width="1.2"/>
    <circle r="3.4" fill="#e8c25e">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#e8c25e" stroke-width="1.1" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <line y1="-11.5" y2="-15"/><line y1="11.5" y2="15"/>
      <line x1="-11.5" x2="-15"/><line x1="11.5" x2="15"/>
    </g>
  </g>
</svg>
