<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Abir Deol">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="50%"  stop-color="#16233d"/>
      <stop offset="100%" stop-color="#2a1d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#ffd97a" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#e0a93a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e0a93a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe9b0"/>
      <stop offset="100%" stop-color="#d09a2e"/>
    </linearGradient>
    <pattern id="meander" x="0" y="0" width="40" height="16" patternUnits="userSpaceOnUse">
      <path d="M2 14 V4 H14 V11 H8 V7 H26 V14 M26 4 H38 V14"
            fill="none" stroke="#d09a2e" stroke-width="1.6" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>

  <g fill="#ffe9b0">
    <circle cx="120" cy="48"  r="1.3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4s"   repeatCount="indefinite"/></circle>
    <circle cx="255" cy="96"  r="1"  ><animate attributeName="opacity" values="0.7;0.1;0.7"   dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="845" cy="58"  r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2"   dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="140" r="1.1"><animate attributeName="opacity" values="0.6;0.15;0.6"  dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="72"  cy="165" r="1.2"><animate attributeName="opacity" values="0.1;0.75;0.1"  dur="7s"   repeatCount="indefinite"/></circle>
    <circle cx="760" cy="185" r="1"  ><animate attributeName="opacity" values="0.5;0.1;0.5"   dur="6s"   repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(500 122)">
    <circle r="120" fill="url(#glow)">
      <animate attributeName="r" values="110;128;110" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- rotating rays, drawn crisp and long so they actually read -->
    <g stroke="#e8c25e" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
      <g stroke-width="3">
        <line y1="-60" y2="-100"/><line y1="60" y2="96"/>
        <line x1="-60" x2="-104"/><line x1="60" x2="104"/>
      </g>
      <g stroke-width="2" transform="rotate(45)" opacity="0.9">
        <line y1="-60" y2="-95"/><line y1="60" y2="95"/>
        <line x1="-60" x2="-95"/><line x1="60" x2="95"/>
      </g>
      <g stroke-width="1.3" transform="rotate(22.5)" opacity="0.65">
        <line y1="-60" y2="-82"/><line y1="60" y2="82"/>
        <line x1="-60" x2="-82"/><line x1="60" x2="82"/>
      </g>
    </g>

    <g fill="none" stroke="#e8c25e" stroke-width="1" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="120s" repeatCount="indefinite"/>
      <circle r="70" stroke-dasharray="4 10"/>
    </g>

    <circle r="52" fill="#0b1220" stroke="url(#gold)" stroke-width="2.5"/>

    <!-- lyre: two curved arms, yoke across the top, strings, soundbox -->
    <g stroke="#e8c25e" fill="none" stroke-linecap="round">
      <path d="M-26 22 C -38 0, -30 -22, -18 -30" stroke-width="3"/>
      <path d="M26 22 C 38 0, 30 -22, 18 -30" stroke-width="3"/>
      <line x1="-21" y1="-27" x2="21" y2="-27" stroke-width="2.6"/>
      <g stroke-width="1.2" opacity="0.95">
        <line x1="-13" y1="-25" x2="-9"  y2="17"/>
        <line x1="-4.5" y1="-26" x2="-3" y2="18"/>
        <line x1="4.5"  y1="-26" x2="3"  y2="18"/>
        <line x1="13"  y1="-25" x2="9"   y2="17"/>
      </g>
      <path d="M-27 20 C -14 30, 14 30, 27 20" stroke-width="3"/>
    </g>
  </g>

  <rect x="0" y="8"   width="1000" height="16" fill="url(#meander)"/>
  <rect x="0" y="276" width="1000" height="16" fill="url(#meander)"/>

  <text x="500" y="254" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="23" letter-spacing="8" fill="#ffe9b0">ABIR DEOL</text>
  <text x="500" y="271" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="10" letter-spacing="4" fill="#d09a2e" opacity="0.85">
    SYSTEMS · GRAPHICS · DISTRIBUTED
  </text>
</svg>
