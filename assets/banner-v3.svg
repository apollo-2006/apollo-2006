<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Abir Deol">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="50%"  stop-color="#16233d"/>
      <stop offset="100%" stop-color="#2a1d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#ffd97a" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#e0a93a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e0a93a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="meander" x="0" y="0" width="40" height="16" patternUnits="userSpaceOnUse">
      <path d="M2 14 V4 H14 V11 H8 V7 H26 V14 M26 4 H38 V14"
            fill="none" stroke="#d09a2e" stroke-width="1.6" opacity="0.5"/>
    </pattern>
    <g id="branch">
      <path d="M10.0 95.5 A 96 96 0 0 0 86.3 -42.1" fill="none" stroke="#e8c25e" stroke-width="1.8" opacity="0.7"/>
      <g fill="#e8c25e" opacity="0.66">
        <ellipse cx="29.2" cy="101.9" rx="11" ry="4.4" transform="rotate(-16 29.2 101.9)"/>
        <ellipse cx="65.3" cy="83.5" rx="11" ry="4.4" transform="rotate(-38 65.3 83.5)"/>
        <ellipse cx="91.8" cy="53.0" rx="11" ry="4.4" transform="rotate(-60 91.8 53.0)"/>
        <ellipse cx="105.0" cy="14.8" rx="11" ry="4.4" transform="rotate(-82 105.0 14.8)"/>
        <ellipse cx="102.9" cy="-25.6" rx="11" ry="4.4" transform="rotate(-104 102.9 -25.6)"/>
      </g>
      <g fill="#e8c25e" opacity="0.38">
        <ellipse cx="39.0" cy="76.6" rx="9.5" ry="3.8" transform="rotate(-27 39.0 76.6)"/>
        <ellipse cx="64.9" cy="56.4" rx="9.5" ry="3.8" transform="rotate(-49 64.9 56.4)"/>
        <ellipse cx="81.3" cy="28.0" rx="9.5" ry="3.8" transform="rotate(-71 81.3 28.0)"/>
        <ellipse cx="85.9" cy="-4.5" rx="9.5" ry="3.8" transform="rotate(-93 85.9 -4.5)"/>
      </g>
    </g>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>

  <g fill="#ffe9b0">
    <circle cx="560" cy="52"  r="1.3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4s"   repeatCount="indefinite"/></circle>
    <circle cx="700" cy="230" r="1"  ><animate attributeName="opacity" values="0.7;0.1;0.7"   dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70"  r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2"   dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="200" r="1.1"><animate attributeName="opacity" values="0.6;0.15;0.6"  dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="80"  r="1.2"><animate attributeName="opacity" values="0.1;0.75;0.1"  dur="7s"   repeatCount="indefinite"/></circle>
    <circle cx="80"  cy="235" r="1"  ><animate attributeName="opacity" values="0.5;0.1;0.5"   dur="6s"   repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="1"  ><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- crest: sun inside a laurel wreath, left half of the canvas -->
  <g transform="translate(258 150)">
    <circle r="112" fill="url(#glow)">
      <animate attributeName="r" values="104;120;104" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#e8c25e" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
      <g stroke-width="2.6">
        <line y1="-56" y2="-88"/><line y1="56" y2="88"/>
        <line x1="-56" x2="-88"/><line x1="56" x2="88"/>
      </g>
      <g stroke-width="1.8" transform="rotate(45)" opacity="0.9">
        <line y1="-56" y2="-80"/><line y1="56" y2="80"/>
        <line x1="-56" x2="-80"/><line x1="56" x2="80"/>
      </g>
      <g stroke-width="1.2" transform="rotate(22.5)" opacity="0.6">
        <line y1="-56" y2="-70"/><line y1="56" y2="70"/>
        <line x1="-56" x2="-70"/><line x1="56" x2="70"/>
      </g>
    </g>

    <g fill="none" stroke="#e8c25e" stroke-width="1" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="120s" repeatCount="indefinite"/>
      <circle r="65" stroke-dasharray="4 10"/>
    </g>

    <circle r="48" fill="#0b1220" stroke="#e8c25e" stroke-width="2.4"/>

    <g stroke="#e8c25e" fill="none" stroke-linecap="round">
      <path d="M-24 20 C -35 0, -28 -20, -17 -28" stroke-width="2.8"/>
      <path d="M24 20 C 35 0, 28 -20, 17 -28" stroke-width="2.8"/>
      <line x1="-19" y1="-25" x2="19" y2="-25" stroke-width="2.4"/>
      <g stroke-width="1.1" opacity="0.95">
        <line x1="-12" y1="-23" x2="-8" y2="16"/>
        <line x1="-4"  y1="-24" x2="-3" y2="16"/>
        <line x1="4"   y1="-24" x2="3"  y2="16"/>
        <line x1="12"  y1="-23" x2="8"  y2="16"/>
      </g>
      <path d="M-25 18 C -13 27, 13 27, 25 18" stroke-width="2.8"/>
    </g>

    <!-- wreath sits around the crest, nothing below it to collide with -->
    <g opacity="0.95">
      <use href="#branch"/>
      <use href="#branch" transform="scale(-1 1)"/>
    </g>
  </g>

  <!-- vertical rule -->
  <rect x="432" y="96" width="1" height="108" fill="#d09a2e" opacity="0.4"/>

  <!-- wordmark, right half, clear of everything -->
  <text x="472" y="146" font-family="Georgia, 'Times New Roman', serif"
        font-size="42" letter-spacing="10" fill="#ffe9b0">ABIR DEOL</text>
  <text x="476" y="178" font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" letter-spacing="5.2" fill="#d09a2e" opacity="0.9">
    SYSTEMS · GRAPHICS · DISTRIBUTED
  </text>

  <rect x="0" y="8"   width="1000" height="16" fill="url(#meander)"/>
  <rect x="0" y="276" width="1000" height="16" fill="url(#meander)"/>
</svg>
