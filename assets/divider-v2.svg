<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 34" width="900" height="34" role="img" aria-label="">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d09a2e" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#d09a2e" stop-opacity="0.7"/>
      <stop offset="72%"  stop-color="#d09a2e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d09a2e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mdr" x="0" y="0" width="34" height="14" patternUnits="userSpaceOnUse">
      <path d="M2 12 V3 H12 V9 H7 V6 H22 V12 M22 3 H32 V12"
            fill="none" stroke="#d09a2e" stroke-width="1.3" opacity="0.5"/>
    </pattern>
    <linearGradient id="mfadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="mfadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mL"><rect x="150" y="0" width="230" height="34" fill="url(#mfadeL)"/></mask>
    <mask id="mR"><rect x="520" y="0" width="230" height="34" fill="url(#mfadeR)"/></mask>
  </defs>

  <rect x="0" y="16.4" width="900" height="1.2" fill="url(#fade)"/>
  <rect x="150" y="10" width="230" height="14" fill="url(#mdr)" mask="url(#mL)"/>
  <rect x="520" y="10" width="230" height="14" fill="url(#mdr)" mask="url(#mR)"/>

  <g transform="translate(450 17)">
    <circle r="13" fill="#0b1220"/>
    <g stroke="#e8c25e" stroke-width="1.1" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <line y1="-11" y2="-15.5"/><line y1="11" y2="15.5"/>
      <line x1="-11" x2="-15.5"/><line x1="11" x2="15.5"/>
      <g opacity="0.6" transform="rotate(45)">
        <line y1="-11" y2="-14"/><line y1="11" y2="14"/>
        <line x1="-11" x2="-14"/><line x1="11" x2="14"/>
      </g>
    </g>
    <circle r="8.5" fill="#0b1220" stroke="#e8c25e" stroke-width="1.2"/>
    <circle r="3.2" fill="#e8c25e">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
